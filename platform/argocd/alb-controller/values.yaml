
albController:
  namespace: azure-alb-system

  podIdentity:
    clientID: "${{ secrets.MGMT_CLINET_ID }}"

  controller:
    replicaCount: 2

    nodeSelector:
      kubernetes.azure.com/agentpool: system

    tolerations:
      - key: CriticalAddonsOnly
        operator: Equal
        value: true
        effect: NoSchedule
