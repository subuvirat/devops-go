
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: go-web-route
  namespace: default
spec:
  parentRefs:
    - name: go-web-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: go-web-app
          port: 80
          weight: 100
