apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: go-web-gateway
  namespace: default
  annotations:
    alb.networking.azure.io/alb-name: agc-alb
    alb.networking.azure.io/alb-namespace: azure-alb-system
spec:
  gatewayClassName: azure-alb-external
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
          
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: agc-tls-secret
      allowedRoutes:
        namespaces:
          from: Same      
