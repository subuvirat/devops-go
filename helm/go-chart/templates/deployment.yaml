# This is a sample deployment manifest file for a simple web application.
apiVersion: apps/v1
kind: Deployment

metadata:
  name: go-web-app
  labels:
    app: go-web-app

spec:
  replicas: 3

  selector:
    matchLabels:
      app: go-web-app

  template:
    metadata:
      labels:
        app: go-web-app
        
    spec:
      # Schedule pods on the AKS user node pool
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}

      # Allow scheduling on the Spot node's NoSchedule taint
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}    

    
      containers:
        - name: go-web-app

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"        